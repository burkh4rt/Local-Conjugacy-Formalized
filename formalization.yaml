status:
  scope:
    "Thirteen compared declarations: every numbered result (including Lemma 1.2) and the two
    Introduction counterexamples in arXiv v1. All proofs are present. Lemma 1.2 is explicitly a
    pointed bijection on actual quotient cohomology. Propositions 2.1 and 2.2 retain infinite
    locally finite discrete coefficients. Proposition 2.3 has no extra prosolvability hypothesis.
    Propositions 3.1 and 3.2 have finite N and profinite G. Theorem 1.1 has arbitrary pronilpotent
    N. Concrete counterexamples include their group identifications, cohomology and conjugacy
    failures. Counts exclude deliberate Challenge proof holes and the noncompiled statement
    template."
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
