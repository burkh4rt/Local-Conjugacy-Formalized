version: v0.4
project:
  name: Local conjugacy in prosolvable groups
  description:
    Lean 4 formalization of all eleven numbered results and both counterexamples in Local conjugacy
    in prosolvable groups, arXiv:2609.37678v1. Closed supplements of a pronilpotent normal subgroup
    are conjugate exactly when locally conjugate under the stated structural hypotheses. Continuous
    nonabelian cohomology has the stated primary restriction decomposition. Local inclusion and
    fixed-point results, the GL(2,3) quaternion counterexample, and the order-162 Heisenberg
    wreath-product counterexample are formalized.
  authors:
    - name: Michael C. Burkhart
      orcid: "0000-0002-2772-5840"
  responsible_maintainers:
    - name: Michael C. Burkhart
      orcid: "0000-0002-2772-5840"
  license: Apache-2.0
