    and registration.
fidelity:
  divergences:
    No known statement-level weakening after the read-back in docs/read-back.md. Right exponent
    notation is represented with left conjugation and left actions. S3 uses the standard order-six
    dihedral presentation. The Heisenberg group uses its upper-unitriangular coordinate law; the
    isomorphism to the constructed N is proved. The quaternion semidirect product is explicitly
    isomorphic to GL(2,3). Proposition 2.2 expands the twisting and coprime fiber argument.
    Proposition 4.1 proves the abelian complement input via finite-quotient cocycle norms rather
    than invoking Shin as an unproved premise. The main proof follows the two Zorn arguments,
    finite-N induction and compactness through G/(N cap U). Proposition 4.2 is supplied with a proof
    via Proposition 4.1. See docs/manuscript-correspondence.md for exact proof files and remaining
    explanatory differences.
review:
  status: author-verified
  reviewers: []
  notes:
    Agent read-back against the downloaded arXiv v1 TeX; all thirteen exact compiled statement
    types, 94 shared definitions and 66 helper proofs match. All 926 local supporting theorem
    declarations were audited for transitive axioms. The local unsandboxed Comparator passed, with
    Lean, NanoDa and con-ron accepting the exported proof (28,033 declarations reported by con-ron).
    See reports/validation.json and reports/local-comparator-validation.json. This is not an
    official Palomar or sandboxed verification. The source author has reserved personal verification
    of definitions and statements before submission; that review was completed. No publication,
    submission or registration has occurred.
alignment:
  namespace: LocalConjugacy
  statements:
    - source: Theorem 1.1
      lean: LocalConjugacy.theorem_1_1
      module: LocalConjugacy.NormalIntersectionCompactness
      status: proved
      note:
        "Matches: arbitrary profinite G; closed normal pronilpotent N; both closed supplements;
        either G prosupersolvable or G/N pronilpotent; conjugacy iff local conjugacy. No finite-N
        restriction."
    - source: Lemma 1.2
      lean: LocalConjugacy.lemma_1_2
      module: LocalConjugacy.ManuscriptCohomology
      status: proved
      note:
        "Matches: profinite J, finite discrete nilpotent coefficient group with continuous action;
        either NJ prosupersolvable or J pronilpotent; simultaneous restriction is bijective onto the
        full product of stable classes indexed by π(J). Preservation of the distinguished class is
        explicitly conjoined in the compared theorem."
    - source: Corollary 1.3
      lean: LocalConjugacy.corollary_1_3
      module: LocalConjugacy.LocalInclusion
      status: proved
      note:
        "Matches: internal semidirect product of closed factors, pronilpotent N, the same structural
        alternative, and N∩H normal in N. A possibly different ambient conjugator and Sylow subgroup
        is allowed for every prime. The conclusion is inclusion of a conjugate of J."
    - source: Corollary 1.4
      lean: LocalConjugacy.corollary_1_4
      module: LocalConjugacy.FixedPointCorollary
      status: proved
      note:
        "Matches: nonempty transitive G-set with every stabilizer closed, and normal N-stabilizer at
        some point. Local fixed points may differ with the prime. No topology or continuous-action
        assumption is imposed on Ω."
    - source: Proposition 2.1
      lean: LocalConjugacy.proposition_2_1
      module: LocalConjugacy.LocallyFiniteCocycles
      status: proved
      note:
        "Matches: locally finite, possibly infinite, discrete p-group N; closed normal J₀; closed
        procyclic pro-p₀ subgroup Q, p₀≠p; Q-stable cocycle. Conclusion gives a cohomologous
        literally Q-fixed representative trivial on J₀∩Q. The symmetric cohomology relation reverses
        the paper's displayed ψ∼φ harmlessly."
    - source: Proposition 2.2
      lean: LocalConjugacy.proposition_2_2
      module: LocalConjugacy.ManuscriptCohomology
      status: proved
      note:
        "Matches: prosolvable J, locally finite discrete p-group N, closed normal J₀ of prime index
        p₀≠p. The actual restriction on quotient cohomology is bijective onto J-stable classes. Its
        distinguished-point preservation is proved in the shared definitions."
    - source: Proposition 2.3
      lean: LocalConjugacy.proposition_2_3
      module: LocalConjugacy.HallRestriction
      status: proved
      note:
        "Matches: profinite J, finite discrete p-group N, prosupersolvable NJ, arbitrary Hall
        subgroup for primes ≤p, and bijectivity onto all H¹(Q,N). The obsolete extra hypothesis
        `Prosolvable J` was removed from both Challenge and Solution."
    - source: Proposition 3.1
      lean: LocalConjugacy.proposition_3_1
      module: LocalConjugacy.ComplementSupersolvable
      status: proved
      note:
        "Matches: the hypotheses of Theorem 1.1 with finite N and two closed complements. Replaced
        the older locally-finite/discrete signature with `[Finite N]`. Discreteness is now derived
        from finiteness and the inherited Hausdorff topology."
    - source: Proposition 3.2
      lean: LocalConjugacy.proposition_3_2
      module: LocalConjugacy.FiniteKernelConjugacy
      status: proved
      note:
        "Matches: exactly Theorem 1.1 with finite N; G is still allowed to be infinite profinite."
    - source: Proposition 4.1
      lean: LocalConjugacy.proposition_4_1
      module: LocalConjugacy.AbelianManuscript
      status: proved
      note:
        "Matches: arbitrary profinite G, closed abelian normal N, two closed supplements H and H′,
        local inclusion implies inclusion of an ambient conjugate. No solvability or
        semidirect-product assumption is added."
    - source: Proposition 4.2
      lean: LocalConjugacy.proposition_4_2
      module: LocalConjugacy.AbelianFixedPoint
      status: proved
      note:
        "Matches: arbitrary transitive nonempty G-set with closed stabilizers, closed H
        supplementing closed abelian normal N, local Sylow fixed points imply an H-fixed point."
    - source: Introduction, quaternion counterexample
      lean: LocalConjugacy.counterexample_quaternion
      module: LocalConjugacy.CounterexampleResults
      status: proved
      note:
        Uses the explicit Q₈ ⋊ S₃ action with a proved isomorphism to GL(2,3); literal cardinality
        two of the quotient cohomology set; trivial Sylow cohomology; actual complements locally
        conjugate at every prime but not conjugate in the ambient group.
    - source: Introduction, Heisenberg counterexample
      lean: LocalConjugacy.counterexample_heisenberg
      module: LocalConjugacy.CounterexampleResults
      status: proved
      note:
        Identifies G with the imprimitive C₃ ≀ S₃, N with the three-coordinate Heisenberg group over
        F₃, J with C₆, and H with C₃×S₃. Proves all four orders, nilpotence of N and J,
        supersolvability of G, the splitting, local inclusion at every prime, failure of global
        inclusion, and failure of normality of N∩H in N.
