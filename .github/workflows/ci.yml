name: Lean and submission completeness
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: true
      - name: Check independent statement surface
        run: python3 scripts/generate_challenge.py --check
      - name: Validate metadata
        run: ruby scripts/validate-formalization.rb
      - name: Check all manuscript proofs and axioms
        run: python3 scripts/check_status.py
      - name: Install Bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Run sandboxed Comparator with independent kernels
        run: bash scripts/run-comparator.sh
